services:
  - type: web
    name: threatintel-analyzer
    env: python
    region: singapore   # Closest to India for low latency
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: VT_API_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: ABUSEIPDB_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: FLASK_SECRET_KEY
        generateValue: true  # Render auto-generates a random secret (DO NOT change after deploy)
      - key: APP_URL
        sync: false          # Set to your Render URL e.g. https://threatintel-analyzer.onrender.com
      - key: MAIL_USERNAME
        sync: false          # Optional: Gmail for password reset
      - key: MAIL_PASSWORD
        sync: false          # Optional: Gmail App Password
      - key: OPEN_BROWSER
        value: "0"           # Don't try to open browser on server
      - key: PYTHON_VERSION
        value: "3.11.6"
